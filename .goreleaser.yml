# GoReleaser configuration for ahorita.
# See https://goreleaser.com for full reference.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ahorita
    main: ./cmd/ahorita
    binary: ahorita
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - formats: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: ahorita
    homepage: https://github.com/primissus/ahorita
    description: A date & time calculator. Type an expression in English or Spanish, get a date back.
    binaries:
      - ahorita
    url:
      verified: github.com/primissus/ahorita
    repository:
      owner: primissus
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_msg_template: "Brew cask: update ahorita to {{ .Tag }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ahorita"]
          end
